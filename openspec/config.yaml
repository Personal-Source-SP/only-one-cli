schema: intent-driven

rules:
  proposal:
    - MUST execute the grill-me skill. Always interview the user to clarify exact context and requirements instead of autonomously deciding.
  architecture:
    - Must use c4-diagrams skill for system boundaries or data flow when a diagram adds clarity.
    - Must use architectural-decision-records skill for each architecturally significant decision.
  design:
    - Must use c4-diagrams skill when design changes boundaries or data flow.
  spec:
    - Must use gherkin-authoring skill.
  scaffold:
    - Read every explicit repository-relative path in context.md before creating scaffold.md.
    - Scaffold.md is a review plan. Do not create implementation code in this phase.
  apply:
    - Running /opsx-apply confirms the user reviewed current planning artifacts.
    - Read every explicit repository-relative path in context.md before implementation.
    - Create approved scaffold code before implementing business logic.
    - If implementation finds a business, specification, or design conflict, update affected planning artifacts first; stop affected work and require user review plus a new /opsx-apply before resuming.
    - Do not patch code to bypass an architecture or specification contract.
