name: intent-driven
version: 2
description: Epic workflow - proposal, behavior specs, architecture contract, explicit context, design, scaffold review, and tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining why the change is needed
    template: proposal.md
    instruction: >
      Create proposal explaining WHY this change matters, WHAT changes, affected
      capabilities, and impact. Keep implementation detail in later artifacts.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: OpenSpec Markdown specs with Gherkin-style behavior scenarios
    template: spec.md
    instruction: >
      Create one spec per capability in proposal. Use OpenSpec delta headers.
      Every requirement needs at least one observable GIVEN, WHEN, THEN scenario.
      For modified requirements, copy and update full existing requirement blocks.
    requires:
      - proposal
  - id: architecture
    generates: architecture.md
    description: Architecture contract for business rules, data flow, boundaries, data, API, and constraints
    template: architecture.md
    instruction: >
      Create architecture contract from proposal and specs. Cover every template
      section. Mark non-applicable data model, API, or quality sections as N/A
      with rationale. Record significant decisions through ADRs and use C4 or
      Mermaid for boundaries or data flow when it improves clarity. Define allowed
      dependencies, prohibited patterns, module boundaries, naming, and traceability.
    requires:
      - proposal
      - specs
  - id: context
    generates: context.md
    description: Explicit manifest of source context required before scaffold or implementation
    template: context.md
    instruction: >
      Create a context manifest using only explicit repository-relative source paths.
      Every required path needs a concrete reason and a read-before phase. Include
      relevant entry points, routers, schemas, types, configs, specs, ADRs, and
      verification commands. Do not use placeholders, wildcards, globs, or copy
      source contents into this artifact.
    requires:
      - architecture
  - id: design
    generates: design.md
    description: Technical design translating architecture contract into implementation strategy
    template: design.md
    instruction: >
      Explain HOW to implement the change. Read architecture and context first.
      Reference architecture sections instead of repeating their contract. Cover
      decisions and alternatives, implementation strategy, risks, migration,
      traceability, and unresolved questions.
    requires:
      - architecture
      - context
  - id: scaffold
    generates: scaffold.md
    description: Reviewable code skeleton plan before implementation
    template: scaffold.md
    instruction: >
      Create a reviewable scaffold plan from specs, architecture, context, and design.
      Define target file tree, boundaries, public types, endpoint and persistence
      skeletons, component map, test stubs, naming checks, and traceability. This
      artifact plans code only; do not create implementation files. User reviews it
      before invoking /opsx-apply.
    requires:
      - design
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create small, ordered checkbox tasks. Start with approved scaffold code,
      then implement focused functions or components, tests, documentation, and
      validation. Each task must reference relevant specs, architecture, design,
      or scaffold sections. Include a doc-drift task requiring planning artifact
      updates and user re-review before resuming affected implementation.
    requires:
      - scaffold
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Running /opsx-apply confirms user review of proposal, specs, architecture,
    context, design, scaffold, and tasks. Read every planning artifact and every
    explicit path listed in context.md before work. Create scaffold code matching
    scaffold.md before business logic. Work through pending tasks and mark complete.
    If implementation reveals a business, specification, or design conflict, update
    affected planning artifacts first, stop affected tasks, and require user review
    plus a new /opsx-apply before resuming. Do not bypass the documented contract.
